version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fixit-rabbitmq
    restart: always
    ports:
      - "5672:5672"     # Porta AMQP do broker
      - "15672:15672"   # Painel Web Management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - fixit-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: fixit-mongodb
    restart: always
    ports:
      - "27017:27017"   # Porta do MongoDB
    environment:
      MONGO_INITDB_DATABASE: fixit_db
    volumes:
      - mongo_data:/data/db
    networks:
      - fixit-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
  mongo_data:

networks:
  fixit-network:
    driver: bridge

